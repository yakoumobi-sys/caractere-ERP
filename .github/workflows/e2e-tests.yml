name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Le job commente la pull request et publie un rapport de tests : sans ces
# droits explicites, le GITHUB_TOKEN est en lecture seule sur les dépôts
# configurés ainsi, et les deux dernières étapes échouent.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Les paquets @supabase/* du projet déclarent node >= 22 ; sur la 18
          # chaque installation partait en avertissements EBADENGINE.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start isolated Supabase
        run: |
          supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor,imgproxy
          supabase status -o json > "$RUNNER_TEMP/supabase-local.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const local = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/supabase-local.json`, 'utf8'));
          const vars = {
            NEXT_PUBLIC_SUPABASE_URL: local.API_URL,
            NEXT_PUBLIC_SUPABASE_ANON_KEY: local.ANON_KEY,
            SUPABASE_SERVICE_ROLE_KEY: local.SERVICE_ROLE_KEY,
            TWILIO_AUTH_TOKEN: 'local-e2e-twilio-token',
            TWILIO_WEBHOOK_URL: 'http://localhost:3000/api/webhooks/twilio',
            SITE_ORDERS_WEBHOOK_SECRET: 'local-e2e-site-secret',
            TEST_USERNAME: 'E2EAdmin',
            TEST_PASSWORD: 'CaractereE2E-2026!',
          };
          for (const [key, value] of Object.entries(vars)) {
            if (!value) throw new Error(`Missing local setting: ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS

      - name: Prepare local test accounts
        run: node tests/e2e/setup-local.mjs

      - name: Build Next.js
        run: npm run build

      - name: Start app
        run: |
          npm run start > "$RUNNER_TEMP/caractere-app.log" 2>&1 &
          npx wait-on http://localhost:3000/login --timeout 60000
        env:
          NODE_ENV: production

      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: App log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/caractere-app.log" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/results/
          retention-days: 30

      - name: Upload JUnit results
        if: always() && hashFiles('tests/results/junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: 'tests/results/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            // Le résultat réel de l'étape de test, et non un message figé :
            // l'ancien script annonçait « All tests passed » même en échec.
            const outcome = process.env.E2E_OUTCOME;
            const passed = outcome === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const status = passed
              ? '✅ Tous les tests sont passés.'
              : outcome === 'skipped'
                ? '⚠️ Les tests n\'ont pas été exécutés (une étape précédente a échoué).'
                : '❌ Des tests ont échoué.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## Tests E2E',
                '',
                `- ${status}`,
                `- [Voir le rapport détaillé](${run})`,
              ].join('\n'),
            });

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
