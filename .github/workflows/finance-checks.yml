name: CRM and financial integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
      - run: npm run test:finance
      - run: npm run build
